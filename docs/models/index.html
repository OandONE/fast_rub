<style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1e1e2f;
      --text-secondary: #5a5a7a;
      --brand: #7b1fa2;
      --brand-dark: #4a148c;
      --brand-light: #b39ddb;
      --accent: #ffb300;
      --border: #e0d0ea;
      --sidebar-bg: #f5f0fa;
      --code-bg: #1e1e2a;
      --code-text: #cdd6f4;
      --table-hover: #ede7f6;
      --shadow: rgba(0,0,0,0.05);
      --copy-btn-bg: #2d2d3f;
      --copy-btn-text: #ffd54f;
      --signature-bg: #f3e9fd;
    }

    [data-theme="dark"] {
      --bg: #0a0a0f;
      --surface: #13131a;
      --text: #cdd6f4;
      --text-secondary: #6c7086;
      --brand: #89b4fa;
      --brand-dark: #b4befe;
      --brand-light: #45475a;
      --accent: #f9e2af;
      --border: #1e1e2a;
      --sidebar-bg: #0f0f15;
      --code-bg: #11111b;
      --code-text: #cdd6f4;
      --table-hover: #1a1a24;
      --shadow: rgba(0,0,0,0.3);
      --copy-btn-bg: #313244;
      --copy-btn-text: #89b4fa;
      --signature-bg: #1a1a24;
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 1000;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 2px 12px var(--shadow);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .theme-toggle:hover {
      transform: scale(1.1);
      border-color: var(--brand);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Roboto, Tahoma, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    a {
      text-decoration: none;
      color: var(--brand);
    }
    a:hover {
      text-decoration: underline;
    }
    .wrapper {
      display: flex;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
      background: var(--surface);
      box-shadow: 0 0 30px var(--shadow);
      transition: background-color 0.3s ease;
    }

    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-left: 1px solid var(--border);
      padding: 2rem 1.5rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }
    .sidebar h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--brand-dark);
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }
    .sidebar .sub {
      color: var(--brand);
      font-weight: 400;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 1rem;
    }
    .nav-links {
      list-style: none;
      margin-bottom: 2.5rem;
    }
    .nav-links li {
      margin-bottom: 0.6rem;
    }
    .nav-links a {
      display: block;
      padding: 0.4rem 0.8rem;
      border-radius: 30px;
      font-weight: 500;
      color: var(--brand-dark);
      transition: all 0.2s;
    }
    .nav-links a:hover {
      background: var(--table-hover);
      text-decoration: none;
    }
    .nav-links .active {
      background: var(--brand-light);
      color: white;
    }
    .toc-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--brand-dark);
      margin: 1.5rem 0 0.8rem;
      padding-top: 1rem;
      border-top: 2px solid var(--border);
    }
    .toc-list {
      list-style: none;
      padding-right: 0;
    }
    .toc-list li {
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .toc-list a {
      color: var(--text-secondary);
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .toc-list a:hover {
      background: var(--table-hover);
    }

    .main {
      flex: 1;
      padding: 2.5rem 3rem;
      background: var(--surface);
      min-width: 0;
      transition: background-color 0.3s ease;
    }
    .main-header {
      margin-bottom: 2.5rem;
    }
    .main-header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--brand-dark);
      margin-bottom: 0.5rem;
    }
    .main-header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

  
    .method {
      margin-bottom: 4rem;
      scroll-margin-top: 1rem;
    }
    .method h2 {
      font-size: 1.9rem;
      font-weight: 600;
      color: var(--text);
      border-bottom: 3px solid var(--accent);
      padding-bottom: 0.5rem;
      margin-bottom: 1.8rem;
    }
    .method .signature {
      background: var(--signature-bg);
      padding: 0.8rem 1.5rem;
      border-radius: 40px;
      display: inline-block;
      font-family: 'Courier New', Courier, monospace;
      direction: ltr;
      color: var(--text);
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .method .desc {
      margin-bottom: 1.8rem;
      color: var(--text-secondary);
    }
    .table-responsive {
      overflow-x: auto;
      margin: 1.5rem 0;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      background: var(--surface);
      transition: background-color 0.3s ease;
    }
    th {
      background: var(--brand-light);
      color: white;
      font-weight: 600;
      padding: 0.9rem 1.2rem;
      text-align: right;
    }
    td {
      padding: 0.9rem 1.2rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tr:last-child td {
      border-bottom: none;
    }
    td:first-child, th:first-child {
      font-family: 'Courier New', monospace;
      direction: ltr;
    }
    td code {
      background: var(--signature-bg);
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .code-block-wrapper {
      position: relative;
      margin: 2rem 0 1.2rem;
      direction: ltr;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px var(--shadow);
    }
    .copy-btn {
      position: absolute;
      right: 0.8rem;
      top: 0.8rem;
      background: var(--copy-btn-bg);
      color: var(--copy-btn-text);
      border: none;
      border-radius: 30px;
      padding: 0.35rem 1.1rem;
      font-size: 0.8rem;
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 500;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .copy-btn:hover {
      background: var(--brand);
      color: white;
    }
    pre[class*="language-"] {
      margin: 0;
      border-radius: 16px;
      padding: 1.8rem 1.5rem 1.2rem;
      background: var(--code-bg);
    }

    .footer {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
    }
    .footer a {
      color: var(--brand);
      font-weight: 600;
    }

    @media (max-width: 900px) {
      .wrapper {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-left: none;
        border-bottom: 1px solid var(--border);
      }
      .main {
        padding: 1.8rem;
      }
      .theme-toggle {
        bottom: 16px;
        left: 16px;
        width: 38px;
        height: 38px;
      }
    }
  </style>

  <button class="theme-toggle" onclick="toggleTheme()" aria-label="تغییر تم" title="تغییر تم دارک/روشن">
    <span id="theme-icon">🌙</span>
  </button>

  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
      updateIcon();
    })();

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateIcon();
    }

    function updateIcon() {
      var icon = document.getElementById('theme-icon');
      var theme = document.documentElement.getAttribute('data-theme');
      icon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
  </script>

<body>
  <div class="wrapper">
    <aside class="sidebar">
      <h1>Fast Rub</h1>

      <div class="main-header">
        <h1>مدل‌ها و فیلترها</h1>
        <p>کلاس‌های کمکی، ساختار دیتا و فیلترهای مورد استفاده در فست‌روب.</p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

  <script src="../docs-data.js"></script>
  <script>
    let modelsData = [];

    function renderModels() {
      const container = document.getElementById('models-container');
      const tocList = document.getElementById('toc-list');
      container.innerHTML = '';
      tocList.innerHTML = '';

      modelsData.forEach((section) => {
        const sectionEl = document.createElement('section');
        sectionEl.className = 'model-section';
        sectionEl.id = section.id;

        const title = document.createElement('h2');
        title.textContent = section.title;
        sectionEl.appendChild(title);

        if (section.description) {
          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = section.description;
          sectionEl.appendChild(desc);
        }

        if (section.class_signature) {
          const sig = document.createElement('div');
          sig.className = 'class-signature';
          sig.textContent = section.class_signature;
          sectionEl.appendChild(sig);
        }

        if (section.init_params && section.init_params.length > 0) {
          const paramsTitle = document.createElement('h3');
          paramsTitle.textContent = '📥 ورودی‌ها';
          sectionEl.appendChild(paramsTitle);

          const div = document.createElement('div');
          div.className = 'table-responsive';
          let table = `<table><thead><tr><th>فیلد</th><th>نوع</th><th>توضیحات</th></tr></thead><tbody>`;
          section.init_params.forEach(p => {
            table += `<tr><td><code>${p[0]}</code></td><td>${p[1]}</td><td>${p[2]}</td></tr>`;
          });
          table += `</tbody></table>`;
          div.innerHTML = table;
          sectionEl.appendChild(div);
        }

        if (section.properties && section.properties.length > 0) {
          const propTitle = document.createElement('h3');
          propTitle.textContent = '📋 پراپرتی‌ها';
          sectionEl.appendChild(propTitle);

          const div = document.createElement('div');
          div.className = 'table-responsive';
          let table = '<table><thead><tr><th>پراپرتی</th><th>نوع</th><th>توضیحات</th></tr></thead><tbody>';
          section.properties.forEach(p => {
            table += `<tr><td><code>${p.name}</code></td><td>${p.type}</td><td>${p.description}</td></tr>`;
          });
          table += '</tbody></table>';
          div.innerHTML = table;
          sectionEl.appendChild(div);
        }

        if (section.methods && section.methods.length > 0) {
          const methodTitle = document.createElement('h3');
          methodTitle.textContent = '⚙️ متدها';
          sectionEl.appendChild(methodTitle);

          const div = document.createElement('div');
          div.className = 'table-responsive';
          let table = '<table><thead><tr><th>متد</th><th>پارامترها</th><th>خروجی</th><th>توضیحات</th></tr></thead><tbody>';
          section.methods.forEach(m => {
            let paramsStr = m.params ? m.params.map(p => `${p[0]}: ${p[1]}`).join(', ') : '—';
            table += `<tr>
                        <td><code>${m.name}()</code></td>
                        <td>${paramsStr}</td>
                        <td>${m.returns || 'None'}</td>
                        <td>${m.description}</td>
                      </tr>`;
          });
          table += '</tbody></table>';
          div.innerHTML = table;
          sectionEl.appendChild(div);
        }

        if (section.subsections) {
          section.subsections.forEach(sub => {
            const subTitle = document.createElement('h3');
            subTitle.textContent = sub.subtitle;
            sectionEl.appendChild(subTitle);

            if (sub.class_signature) {
              const sig = document.createElement('div');
              sig.className = 'class-signature';
              sig.style.marginRight = '0';
              sig.textContent = sub.class_signature;
              sectionEl.appendChild(sig);
            }

            if (sub.properties && sub.properties.length > 0) {
              const div = document.createElement('div');
              div.className = 'table-responsive';
              let table = '<table><thead><tr><th>پراپرتی</th><th>نوع</th><th>توضیحات</th></tr></thead><tbody>';
              sub.properties.forEach(p => {
                table += `<tr><td><code>${p.name}</code></td><td>${p.type}</td><td>${p.description}</td></tr>`;
              });
              table += '</tbody></table>';
              div.innerHTML = table;
              sectionEl.appendChild(div);
            }
          });
        }

        if (section.filter_groups) {
          section.filter_groups.forEach(group => {
            const groupTitle = document.createElement('h3');
            groupTitle.textContent = group.group;
            sectionEl.appendChild(groupTitle);

            const div = document.createElement('div');
            div.className = 'table-responsive';
            let table = '<table><thead><tr><th>فیلتر</th><th>پارامتر</th><th>توضیحات</th></tr></thead><tbody>';
            group.filters.forEach(f => {
              let params = f.params ? f.params.map(p => `${p[0]}: ${p[1]}`).join(', ') : '—';
              table += `<tr><td><code>${f.name}</code></td><td>${params}</td><td>${f.description}</td></tr>`;
            });
            table += '</tbody></table>';
            div.innerHTML = table;
            sectionEl.appendChild(div);
          });
        }

        if (section.note) {
          const noteP = document.createElement('p');
          noteP.style.background = '#fef9e7';
          noteP.style.padding = '0.8rem 1.2rem';
          noteP.style.borderRadius = '8px';
          noteP.style.borderRight = '4px solid #ffb300';
          noteP.textContent = '📌 ' + section.note;
          sectionEl.appendChild(noteP);
        }

        if (section.example) {
          const exTitle = document.createElement('p');
          exTitle.style.fontWeight = 'bold';
          exTitle.style.margin = '1.8rem 0 0.5rem';
          exTitle.textContent = '🧪 مثال';
          sectionEl.appendChild(exTitle);

          const wrapper = document.createElement('div');
          wrapper.className = 'code-block-wrapper';
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'کپی';
          wrapper.appendChild(btn);

          const pre = document.createElement('pre');
          const code = document.createElement('code');
          code.className = 'language-python';
          code.textContent = section.example.trim();
          pre.appendChild(code);
          wrapper.appendChild(pre);
          sectionEl.appendChild(wrapper);
        }

        container.appendChild(sectionEl);

        const tocItem = document.createElement('li');
        const tocLink = document.createElement('a');
        tocLink.href = `#${section.id}`;
        tocLink.textContent = section.title.replace('🔹', '').trim();
        tocItem.appendChild(tocLink);
        tocList.appendChild(tocItem);
      });

      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
          const pre = this.nextElementSibling;
          const code = pre.querySelector('code');
          navigator.clipboard.writeText(code.textContent).then(() => {
            this.textContent = '✅ کپی شد!';
            setTimeout(() => { this.textContent = 'کپی'; }, 1200);
          });
        });
      });

      if (window.Prism) Prism.highlightAll();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        modelsData = await DocsData.load("models");
        renderModels();
      } catch (error) {
        DocsData.showError("models-container", error);
      }
    });
  </script>
</body>
