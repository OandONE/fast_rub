  <button class="theme-toggle" onclick="toggleTheme()" aria-label="تغییر تم" title="تغییر تم دارک/روشن">

  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
      updateIcon();
    })();

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateIcon();
    }

    function updateIcon() {
      var icon = document.getElementById('theme-icon');
      var theme = document.documentElement.getAttribute('data-theme');
      icon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
  </script>

              ["filters", "InlineFilter | None", "فیلتر(ها) برای محدود کردن کلیک‌های دریافتی"],
          ],
          returns: [
              ["UpdateButton", "<a href='../models/index.html#updatebutton'>UpdateButton</a>", "اطلاعات کلیک"],
          ],
          example: `@bot.on_button_url("/my-button-webhook")\nasync def button_click(upd: UpdateButton):\n    await upd.send_text("کلیک دریافت شد!")`
      },
      // ===== ۴۴. on_ready =====
      {
          id: "on_ready",
          title: "دکوراتور آماده‌بودن کلاینت",
          signature: "@bot.on_ready()",
          desc: "وقتی کلاینت کاملاً آمادهٔ ارسال درخواست شد و تست ارتباط با سرور موفق بود، این هندلر فراخوانی می‌شود.",
          params: [],
          returns: null,
          example: `@bot.on_ready()\nasync def ready():\n    print("✅ ربات آماده است و تست ارتباط موفق بود!")`
      },
      // ===== ۴۵. on_start =====
      {
          id: "on_start",
          title: "دکوراتور شروع کلاینت (بدون تست ارتباط)",
          signature: "@bot.on_start()",
          desc: "وقتی کلاینت راه‌اندازی می‌شود (متُد `start()` صدا زده می‌شود)، این هندلر اجرا می‌شود. برخلاف `on_ready`، هیچ درخواستی به سرور ارسال نمی‌کند.",
          params: [],
          returns: null,
          example: `@bot.on_start()\nasync def started():\n    print("🚀 کلاینت راه‌اندازی شد.")`
      },
      // ===== ۴۶. on_run =====
      {
          id: "on_run",
          title: "دکوراتور اجرای حلقهٔ اصلی",
          signature: "@bot.on_run()",
          desc: "وقتی متُد `run()` صدا زده می‌شود و حلقهٔ اصلی دریافت آپدیت‌ها شروع می‌شود، این هندلر فراخوانی می‌شود.",
          params: [],
          returns: null,
          example: `@bot.on_run()\nasync def running():\n    print("🔄 حلقهٔ اصلی دریافت پیام‌ها شروع شد.")`
      },
      // ===== ۴۷. on_live =====
      {
          id: "on_live",
          title: "دکوراتور زنده شدن ربات (رسیدن به آخرین پیام)",
          signature: "@bot.on_live()",
          desc: "در حالت Polling، وقتی ربات به آخرین پیام رسید و همهٔ پیام‌های معوقه را پردازش کرد (catch up کامل شد)، این هندلر فراخوانی می‌شود.",
          params: [],
          returns: null,
          example: `@bot.on_live()\nasync def live():\n    print("🟢 ربات زنده است — همهٔ پیام‌های قبلی پردازش شدند.")`
      },
      // ===== ۴۸. on_error =====
      {
          id: "on_error",
          title: "دکوراتور مدیریت خطا",
          signature: "@bot.on_error(error_detail='message')",
          desc: "وقتی خطایی در هر بخش از ربات رخ دهد، این هندلر فراخوانی می‌شود.",
          params: [
              ["error_detail", "'full' | 'message' | 'type' = 'message'", "سطح جزئیات خطا: full (traceback کامل)، message (فقط پیام خطا)، type (فقط نوع خطا)"],
          ],
          returns: null,
          example: `@bot.on_error(error_detail="full")\nasync def handle_error(error, update=None):\n    print(f"❌ خطا رخ داد:\\n{error}")`
      },
      // ===== ۴۹. middleware =====
      {
          id: "middleware",
          title: "دکوراتور Middleware",
          signature: "@bot.middleware(filters=None)",
          desc: "یک لایهٔ میانی (Middleware) به ربات اضافه می‌کند. قبل از رسیدن هر آپدیت به handler اصلی، از middlewareها عبور می‌کند.",
          params: [
              ["filters", "Filter | None", "فیلتر(ها) برای محدود کردن پیام‌هایی که از این middleware عبور می‌کنند"],
          ],
          returns: [
              ["bool", "bool", "True = ادامهٔ پردازش، False = توقف زنجیره"],
          ],
          example: `@bot.middleware()\nasync def log_middleware(update, next_handler):\n    print(f"📩 پیام از {update.sender_id}")\n    return await next_handler(update)`
      },
      // ===== ۵۰. load_plugins =====
      {
          id: "load_plugins",
          title: "بارگذاری همهٔ پلاگین‌ها از پوشه",
          signature: "async load_plugins(folder='plugins')",
          desc: "همهٔ فایل‌های `.py` داخل پوشهٔ مشخص‌شده را به‌عنوان پلاگین بارگذاری می‌کند.",
          params: [
              ["folder", "str = 'plugins'", "مسیر پوشهٔ پلاگین‌ها"],
          ],
          returns: [
              ["count", "int", "تعداد پلاگین‌های بارگذاری‌شده"],
          ],
          example: `count = await bot.load_plugins("my_plugins")\nprint(f"{count} پلاگین بارگذاری شد.")`
      },
      // ===== ۵۱. load_plugin =====
      {
          id: "load_plugin",
          title: "بارگذاری یک پلاگین خاص",
          signature: "async load_plugin(filepath)",
          desc: "یک فایل پلاگین مشخص را بارگذاری می‌کند.",
          params: [
              ["filepath", "str", "مسیر فایل پلاگین (مثلاً `plugins/admin.py`)"],
          ],
          returns: [
              ["success", "bool", "True اگر پلاگین با موفقیت بارگذاری شد"],
          ],
          example: `ok = await bot.load_plugin("plugins/my_plugin.py")`
      },
      // ===== ۵۲. on_shutdown =====
      {
          id: "on_shutdown",
          title: "دکوراتور خاموش‌شدن ربات",
          signature: "@bot.on_shutdown()",
          desc: "وقتی متُد `close()` صدا زده می‌شود و ربات در حال خاموش شدن است، این هندلر فراخوانی می‌شود.",
          params: [],
          returns: null,
          example: `@bot.on_shutdown()\nasync def shutdown():\n    print("🛑 ربات در حال خاموش شدن...")\n    await save_data()`
      },
      // ===== ۵۳. add_background_task =====
      {
          id: "add_background_task",
          title: "اضافه کردن تسک پس‌زمینه",
          signature: "add_background_task(coro, *args, delay=0.0, **kwargs)",
          desc: "یک تسک (coroutine) را در پس‌زمینه اجرا می‌کند. می‌توانید با `delay` اجرای آن را به تعویق بیندازید.",
          params: [
              ["coro", "Callable", "تابع coroutine برای اجرا"],
              ["*args", "tuple", "آرگومان‌های موقعیتی برای تابع"],
              ["delay", "float = 0.0", "تأخیر قبل از اجرا (ثانیه)"],
              ["**kwargs", "dict", "آرگومان‌های کلیدی برای تابع"],
          ],
          returns: [
              ["task", "asyncio.Task", "تسک ساخته‌شده (می‌توانید cancel کنید)"],
          ],
          example: `async def periodic_cleanup():\n    while True:\n        await clean_old_logs()\n        await asyncio.sleep(3600)\n\nbot.add_background_task(periodic_cleanup)`
      },
      // ===== ۵۴. render =====
      {
          id: "render",
          title: "رندر دستی قالب پیام (با جلوگیری از XSS)",
          signature: "render(template, auto_escape=True, **kwargs)",
          desc: "یک قالب متنی را با متغیرهای داده‌شده رندر می‌کند. خروجی متن رندر‌شده و لیست متادیتای دکمه‌هاست.",
          params: [
              ["template", "str", "قالب متنی (مثلاً `سلام {{ name }}`)"],
              ["auto_escape", "bool = True", "فرار خودکار کاراکترهای HTML/Markdown"],
              ["**kwargs", "dict", "متغیرهای قالب (مثلاً `name='علی'`)"],
          ],
          returns: [
              ["rendered_text", "str", "متن رندر‌شده"],
              ["metadata", "list[dict]", "متادیتای دکمه‌های استخراج‌شده از قالب"],
          ],
          example: `text, meta = bot.render("سلام {{ name }}، خوبی؟", name="علی")\nawait bot.send_message(chat_id, text, meta_data=meta)`
      },
      // ===== ۵۵. setup_webhooks =====
      {
          id: "setup_webhooks",
          title: "معرفی Webhook به سرورهای روبیکا",
          signature: "async setup_webhooks()",
          desc: "آدرس‌های webhook تنظیم‌شده در کلاس WebhookServer را به سرورهای روبیکا ارسال می‌کند. (خروجی ندارد.)",
          params: [],
          returns: null,
          example: `await bot.setup_webhooks()\nprint("✅ Webhookها ثبت شدند.")`
      },
      // ===== ۵۶. set_main_parse_mode =====
      {
          id: "set_main_parse_mode",
          title: "تغییر پارس مود اصلی کلاینت",
          signature: "async set_main_parse_mode(parse_mode)",
          desc: "پارس مود پیش‌فرض را برای تمام متدهای ارسال پیام تغییر می‌دهد. برای بازگشت به پیروی از ورودی متدها، مقدار `'Null'` را بدهید.",
          params: [
              ["parse_mode", "'Markdown' | 'HTML' | 'Null' | None", "پارس مود جدید (Null = اعمال جداگانه برای هر متد)"],
          ],
          returns: null,
          example: `await bot.set_main_parse_mode("HTML")`
      },
      // ===== ۵۷. send_requests =====
      {
          id: "send_requests",
          title: "ارسال درخواست خام به API",
          signature: "async send_requests(method, data_)",
          desc: "درخواست مستقیم به Bot API با retry خودکار. مناسب برای متدهایی که کتابخانه پوشش نداده.",
          params: [
              ["method", "str", "نام متد API (مثلاً 'sendMessage')"],
              ["data_", "dict | None", "دیکشنری پارامترها"],
          ],
          returns: [
              ["response", "dict", "پاسخ خام سرور"]
          ],
          example: `resp = await bot.send_requests("getMe")\nprint(resp)`
      },
      // ===== ۵۸. from_config =====
      {
          id: "from_config",
          title: "ساخت کلاینت از فایل کانفیگ",
          signature: "await Client.from_config(config)",
          desc: "یک کلاس‌متد (classmethod) که یک شیء Client را از مسیر فایل JSON یا دیکشنری تنظیمات می‌سازد.",
          params: [
              ["config", "str | dict", "مسیر فایل JSON یا دیکشنری شامل پارامترهای Client"],
          ],
          returns: [
              ["client", "Client", "نمونهٔ ساخته‌شده از Client"]
          ],
          example: `bot = await Client.from_config("config.json")\n# یا\nbot = await Client.from_config({"name_session": "bot1", "token": "..."})`
      },
      // ===== ۵۹. دکوراتورهای polling/webhook مخفی (on_edit, on_delete, etc) =====
      {
          id: "extra_decorators",
          title: "دکوراتورهای اضافه (ویرایش، حذف، همه)",
          signature: "@bot.on_edit(filters=None)  @bot.on_delete(filters=None)  @bot.on_all_message(filters=None)",
          desc: "دکوراتورهای میانبر برای دریافت فقط ویرایش‌ها، حذف‌ها، یا همهٔ پیام‌ها (پولینگ). نسخه‌های webhook هم وجود دارند: `on_edit_updates`, `on_delete_updates`, `on_all_message_updates`.",
          params: [
              ["filters", "Filter | None", "فیلتر پیام (اختیاری)"],
          ],
          returns: [
              ["Message", "<a href='../models/index.html#update'>Message</a>", "شی اطلاعات پیام"]
          ],
          example: `@bot.on_edit()\nasync def edited(msg: Message):\n    print("ویرایش شد:", msg.text)\n\n@bot.on_delete_updates()\nasync def deleted(msg: Message):\n    print("حذف شد:", msg.message_id)`
      },
      // ===== ۶۰. دکوراتورهای before_send / after_send =====
      {
          id: "before_after_send",
          title: "هندلرهای پیش/پس از ارسال",
          signature: "@bot.before_send()  @bot.after_send()",
          desc: "قبل از هر ارسال (اگر `before_send` مقدار `False` برگرداند، ارسال لغو می‌شود) و بعد از هر ارسال (با دسترسی به نتیجه) اجرا می‌شوند.",
          params: [],
          returns: null,
          example: `@bot.before_send()\nasync def check_spam(**kwargs):\n    if "اسپم" in kwargs.get("text", ""):\n        return False\n    return True\n\n@bot.after_send()\nasync def log_send(result, **kwargs):\n    print("ارسال شد:", result)`
      },
      // ===== ۶۱. دکوراتورهای before_run / after_run =====
      {
          id: "before_after_run",
          title: "هندلرهای پیش/پس از run",
          signature: "@bot.before_run()  @bot.after_run()",
          desc: "قبل از شروع حلقهٔ اصلی (`run()`) و بعد از توقف حلقه اجرا می‌شوند.",
          params: [],
          returns: null,
          example: `@bot.before_run()\nasync def setup_db():\n    print("اتصال به دیتابیس")\n\n@bot.after_run()\nasync def cleanup():\n    print("پاکسازی منابع")`
      },
      // ===== ۶۲. on_log =====
      {
          id: "on_log",
          title: "هندلر رویدادهای لاگ",
          signature: "@bot.on_log()",
          desc: "هر رویداد لاگ (با جزئیات) به این هندلر ارسال می‌شود.",
          params: [],
          returns: null,
          example: `@bot.on_log()\nasync def log_handler(log_entry):\n    print(log_entry)`
      },
      // ===== ۶۳. helpers (close/stop) اصلاح‌شده =====
      {
        id: "helpers",
        title: "متود های کمکی (close و stop)",
        signature: "close(type_stop='all') ; stop()",
        desc: "`stop()` فقط دریافت آپدیت‌ها را متوقف می‌کند. `close()` کل منابع را آزاد کرده و ربات را کاملاً خاموش می‌کند. می‌توانید با `type_stop='running'` فقط حلقه را متوقف کنید (مانند stop).",
        params: [
          ["type_stop", "'all' | 'running' = 'all'", "نوع توقف: all = آزادسازی کامل، running = فقط توقف حلقه"],
        ],
        returns: null,
        example: `# توقف موقت\nawait bot.stop()\n\n# خاموشی کامل\nawait bot.close()\n\n# توقف حلقه بدون آزادسازی کامل\nawait bot.close(type_stop='running')`
      },
    ];

    function renderDocs() {
      const container = document.getElementById('methods-container');
      const tocList = document.getElementById('toc-list');
      container.innerHTML = '';
      tocList.innerHTML = '';

      methodsData.forEach((method) => {
        const section = document.createElement('section');
        section.className = 'method';
        section.id = method.id;

        const title = document.createElement('h2');
        title.textContent = method.title;
        section.appendChild(title);

        if (method.signature) {
          const sig = document.createElement('div');
          sig.className = 'signature';
          sig.textContent = method.signature;
          section.appendChild(sig);
        }

        if (method.desc) {
          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = method.desc;
          section.appendChild(desc);
        }

        if (method.params && method.params.length > 0) {
          const tableTitle = document.createElement('p');
          tableTitle.style.fontWeight = 'bold';
          tableTitle.style.margin = '1.5rem 0 0.5rem';
          tableTitle.textContent = '📥 ورودی‌ها';
          section.appendChild(tableTitle);

          const div = document.createElement('div');
          div.className = 'table-responsive';
          const table = document.createElement('table');
          const thead = `<thead><tr><th>فیلد</th><th>نوع</th><th>توضیحات</th></tr></thead>`;
          let tbody = '<tbody>';
          method.params.forEach(p => {
            tbody += `<tr><td><code>${p[0]}</code></td><td>${p[1]}</td><td>${p[2]}</td></tr>`;
          });
          tbody += '</tbody>';
          table.innerHTML = thead + tbody;
          div.appendChild(table);
          section.appendChild(div);
        }

        if (method.returns && method.returns.length > 0) {
          const tableTitle = document.createElement('p');
          tableTitle.style.fontWeight = 'bold';
          tableTitle.style.margin = '1.5rem 0 0.5rem';
          tableTitle.textContent = '📤 خروجی';
          section.appendChild(tableTitle);

          const div = document.createElement('div');
          div.className = 'table-responsive';
          const table = document.createElement('table');
          const thead = `<thead><tr><th>فیلد</th><th>نوع</th><th>توضیحات</th></tr></thead>`;
          let tbody = '<tbody>';
          method.returns.forEach(r => {
            tbody += `<tr><td><code>${r[0]}</code></td><td>${r[1]}</td><td>${r[2]}</td></tr>`;
          });
          tbody += '</tbody>';
          table.innerHTML = thead + tbody;
          div.appendChild(table);
          section.appendChild(div);
        }

        if (method.example) {
          const exTitle = document.createElement('p');
          exTitle.style.fontWeight = 'bold';
          exTitle.style.margin = '1.8rem 0 0.5rem';
          exTitle.textContent = '🧪 مثال';
          section.appendChild(exTitle);

          const wrapper = document.createElement('div');
          wrapper.className = 'code-block-wrapper';
          const btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'کپی';
          wrapper.appendChild(btn);

          const pre = document.createElement('pre');
          const code = document.createElement('code');
          code.className = 'language-python';
          code.textContent = method.example.trim();
          pre.appendChild(code);
          wrapper.appendChild(pre);
          section.appendChild(wrapper);
        }

        container.appendChild(section);

        const tocItem = document.createElement('li');
        const tocLink = document.createElement('a');
        tocLink.href = `#${method.id}`;
        tocLink.textContent = method.title;
        tocItem.appendChild(tocLink);
        tocList.appendChild(tocItem);
      });

      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const pre = this.nextElementSibling;
          const code = pre.querySelector('code');
          navigator.clipboard.writeText(code.textContent).then(() => {
            this.textContent = '✅ کپی شد!';
            setTimeout(() => { this.textContent = 'کپی'; }, 1200);
          });
        });
      });

      if (window.Prism) {
        Prism.highlightAll();
      }
    }

    window.addEventListener('DOMContentLoaded', renderDocs);
  </script>
