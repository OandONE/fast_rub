  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
      updateIcon();
    })();

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateIcon();
    }

    function updateIcon() {
      var icon = document.getElementById('theme-icon');
      var theme = document.documentElement.getAttribute('data-theme');
      icon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }

                <tr><td><code>hotreload</code></td><td><code>pip install fastrub[hotreload]</code></td><td>Hot Reload</td></tr>
                <tr><td><code>jalali</code></td><td><code>pip install fastrub[jalali]</code></td><td>تاریخ شمسی Scheduler</td></tr>
                <tr><td><code>progress</code></td><td><code>pip install fastrub[progress]</code></td><td>نوار پیشرفت (tqdm)</td></tr>
                <tr><td><code>pillow</code></td><td><code>pip install fastrub[pillow]</code></td><td>پردازش تصویر در یوزربات</td></tr>
                <tr><td><code>moviepy</code></td><td><code>pip install fastrub[moviepy]</code></td><td>پردازش ویدیو در یوزربات</td></tr>
                <tr><td><code>aiortc</code></td><td><code>pip install fastrub[aiortc]</code></td><td>تماس صوتی/تصویری</td></tr>
                <tr><td><code>userbot</code></td><td><code>pip install fastrub[userbot]</code></td><td>یوزربات</td></tr>
                <tr><td><code>userbot-full</code></td><td><code>pip install fastrub[userbot-full]</code></td><td>یوزربات کامل</td></tr>
                <tr><td><code>full</code></td><td><code>pip install fastrub[full]</code></td><td>همه چیز یک‌جا</td></tr>
              </tbody>
            </table>
          </div>`
      },
    ];

    function renderNotes() {
      const container = document.getElementById('notes-container');
      const tocList = document.getElementById('toc-list');
      container.innerHTML = '';
      tocList.innerHTML = '';

      notesData.forEach((note) => {
        const section = document.createElement('section');
        section.className = 'note' + (note.type ? ' ' + note.type : '');
        section.id = note.id;

        const title = document.createElement('h2');
        title.innerHTML = `<span class="badge">${note.icon}</span><span>${note.title}</span>`;
        section.appendChild(title);

        const body = document.createElement('div');
        body.innerHTML = note.html;
        section.appendChild(body);

        container.appendChild(section);

        const tocItem = document.createElement('li');
        const tocLink = document.createElement('a');
        tocLink.href = `#${note.id}`;
        tocLink.textContent = note.title;
        tocItem.appendChild(tocLink);
        tocList.appendChild(tocItem);
      });
    }

    window.addEventListener('DOMContentLoaded', renderNotes);
  </script>
</body>
