  <button class="theme-toggle" onclick="toggleTheme()" aria-label="تغییر تم" title="تغییر تم دارک/روشن">
    <span id="theme-icon">🌙</span>
  </button>

  <script>
    (function() {
      var saved = localStorage.getItem('theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
      updateIcon();
    })();

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateIcon();
    }

    function updateIcon() {
      var icon = document.getElementById('theme-icon');
      var theme = document.documentElement.getAttribute('data-theme');
      icon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="../docs-data.js"></script>
  <script>
    let notesData = [];

    function renderNotes() {
      const container = document.getElementById('notes-container');
      const tocList = document.getElementById('toc-list');
      container.innerHTML = '';
      tocList.innerHTML = '';

      notesData.forEach((note) => {
        const section = document.createElement('section');
        section.className = 'note' + (note.type ? ' ' + note.type : '');
        section.id = note.id;

        const title = document.createElement('h2');
        title.innerHTML = `<span class="badge">${note.icon}</span><span>${note.title}</span>`;
        section.appendChild(title);

        const body = document.createElement('div');
        body.innerHTML = note.markdown
          ? (window.marked ? marked.parse(note.markdown) : note.markdown)
          : '';
        section.appendChild(body);

        container.appendChild(section);

        const tocItem = document.createElement('li');
        const tocLink = document.createElement('a');
        tocLink.href = `#${note.id}`;
        tocLink.textContent = note.title;
        tocItem.appendChild(tocLink);
        tocList.appendChild(tocItem);
      });
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        notesData = await DocsData.load("prerequisites");
        renderNotes();
      } catch (error) {
        DocsData.showError("notes-container", error);
      }
    });
  </script>
